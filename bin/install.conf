# bin/install.sh settings for built.indie (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: they go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/built-indie--prod (BUILTINDIE_KEY, BUILTINDIE_ADMIN_KEY,
# RESEND_API_KEY, MAIL_FROM, COINPAY_*).
#
# DOMAINS is empty on purpose: built.indie is a Moshpit name, so there is no Let's
# Encrypt certificate to get. Its nginx vhost (deploy/nginx-built.indie.conf) proxies
# to PORT with the Moshpit-issued certificate that moshpit-renew.timer keeps fresh.
APP=built-indie
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8798
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
