# built.indie on dev2: the Moshpit origin vhost. Installed as
# /etc/moshpit/templates/built.indie.conf so moshpit-renew keeps it on renewal.
#
# Port 80 serves the site too (no redirect): a stock browser cannot check a
# Moshpit certificate, and the pit.world relay connects over TLS anyway.
# No request log: launch and sign-in URLs carry tokens, and nginx writes the
# request line into error-level entries too, hence crit.

server {
    listen 80;
    listen [::]:80;
    server_name built.indie;
    access_log off;
    error_log  /var/log/nginx/built.indie.error.log crit;
    client_max_body_size 1m;

    # The app: github.com/moshcoder/built.indie, systemd unit built-indie, /opt/built.indie.
    location / {
        proxy_pass http://127.0.0.1:8798;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name built.indie;

    ssl_certificate     /etc/ssl/moshpit/built.indie.crt;
    ssl_certificate_key /etc/ssl/moshpit/built.indie.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;
    # No HSTS: a promise about a name the public DNS does not own.

    access_log off;
    error_log  /var/log/nginx/built.indie.error.log crit;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8798;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Launching reads a site and screenshots it: allow it the time.
        proxy_read_timeout 120s;
    }
}
